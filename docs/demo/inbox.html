<!doctype html>
<!-- Generated by scripts/export_inbox_demo.py. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triage inbox · Subpoena</title>
<style>
  :root {
    color-scheme: dark;
    --desk: #14161a; --panel: #1c1f26; --line: #2c313c; --ink: #e8e6df; --dim: #8b919e;
    --ok: #1f9d55; --warn: #c77800; --bad: #d03b3b; --unk: #8a52c7; --accent: #4f8cff;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--desk); color: var(--ink); font: 15px/1.5 var(--sans); }
  main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
  .back { color: #8cb2ff; font-size: 14px; }
  h1 { margin: 10px 0 16px; font-size: clamp(28px, 5vw, 40px); line-height: 1.15; }
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 8px 16px; margin-bottom: 12px;
  }
  #claim-filter { margin: 0 0 12px; }
  #claim-filter a { color: #8cb2ff; }
  #status { margin: 0; color: var(--dim); }
  .toggle { display: inline-flex; align-items: center; gap: 7px; min-height: 36px;
    cursor: pointer; }
  .toggle input { accent-color: var(--accent); }
  ul { list-style: none; margin: 0; padding: 0; }
  li + li { margin-top: 8px; }
  .row {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center;
    gap: 5px 12px; padding: 12px; color: inherit; text-decoration: none;
    border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
  }
  .row:hover { border-color: var(--accent); }
  a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .caller { font-weight: 650; overflow-wrap: anywhere; }
  .summary {
    grid-column: 1 / -1; color: #b4b8c2;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .stamps { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 5px; }
  .severity, .stamp { font: 600 11px/1.4 var(--mono); }
  .severity { grid-column: 2; grid-row: 1; color: var(--dim); }
  .stamp {
    padding: 2px 6px; border: 1px solid currentColor; border-radius: 4px;
    overflow-wrap: anywhere;
  }
  .VERIFIED { color: var(--ok); } .MISMATCH { color: var(--warn); }
  .NOT_FOUND { color: var(--bad); } .UNVERIFIABLE { color: var(--unk); }
  @media (min-width: 780px) {
    main { padding: 36px 24px 60px; }
    .row { grid-template-columns: minmax(0, 1.1fr) minmax(0, 3fr) 80px minmax(0, 2.6fr);
      padding: 12px 16px; }
    .summary, .severity, .stamps { grid-column: auto; grid-row: auto; }
  }
</style>
</head>
<body>
<main>
  <a class="back" href="index.html">← Demo viewer</a>
  <h1>Triage inbox</h1>
  <p id="claim-filter" hidden>
    Showing calls with <strong id="active-claim-type"></strong> verdicts.
    <a href="inbox.html">Clear filter</a>
  </p>
  <div class="toolbar">
    <p id="status" role="status">Loading audited calls…</p>
    <label class="toggle"><input id="show-all" type="checkbox" disabled> Show all calls</label>
  </div>
  <ul id="calls" aria-label="Audited calls"></ul>
</main>
<script>
"use strict";

const priority = new Map([
  ["MISMATCH", 0],
  ["NOT_FOUND", 1],
  ["UNVERIFIABLE", 2],
]);
const STAMP = { VERIFIED: "RECEIPT FOUND", MISMATCH: "RECEIPT DOES NOT MATCH",
  NOT_FOUND: "NO RECEIPT", UNVERIFIABLE: "COULD NOT CHECK" };
const claimTypes = new Set(["AppointmentBooked", "Rescheduled", "Cancelled", "ConfirmationSent", "HandoffCreated", "PaymentCollected", "RecordsUpdated", "PrescriptionRefilled"]);
const requestedType = new URLSearchParams(location.search).get("claim_type");
const claimType = claimTypes.has(requestedType) ? requestedType : null;
const showAll = document.getElementById("show-all");
const list = document.getElementById("calls");
const statusMessage = document.getElementById("status");

function element(tag, className, value) {
  const node = document.createElement(tag);
  node.className = className;
  if (value !== undefined) node.textContent = value;
  return node;
}

async function readJSON(path) {
  const response = await fetch(path);
  if (!response.ok) throw new Error(`Could not load ${path}`);
  return response.json();
}

async function loadCall(scenario) {
  const id = encodeURIComponent(scenario.id);
  const report = await readJSON(`data/run-${id}.json`);
  let rank = priority.size;
  let issue;
  for (const verdict of report.verdicts) {
    const candidate = priority.get(verdict.status);
    if (candidate !== undefined && candidate < rank) {
      rank = candidate;
      issue = verdict;
    }
  }
  return { id, title: scenario.title, report, issue, rank };
}

function callRow({ id, title, report, issue }) {
  const row = document.createElement("li");
  const link = element("a", "row");
  link.href = `index.html#${id}`;

  const caller = report.call.caller;
  const name = element("span", "caller", caller?.name || caller?.phone || "Unknown caller");
  const summary = issue ? title
    : (report.verdicts.length ? "All claims verified." : "No claim verdicts.");
  const detail = element("span", "summary", summary);
  detail.title = issue?.summary ?? summary;
  const severity = element("span", "severity",
    issue?.severity ?? report.verdicts[0]?.severity ?? "—");
  severity.setAttribute("aria-label", `Severity: ${severity.textContent}`);
  const verdicts = element("span", "stamps");
  for (const verdict of report.verdicts) {
    const status = verdict.status;
    const stamp = Object.hasOwn(STAMP, status)
      ? element("span", `stamp ${status}`, STAMP[status])
      : element("span", "stamp", status);
    verdicts.append(stamp);
  }
  link.append(name, detail, severity, verdicts);
  row.append(link);
  return row;
}

function render(calls) {
  const visible = showAll.checked ? calls : calls.filter((call) => call.issue);
  list.replaceChildren(...visible.map(callRow));
  statusMessage.textContent = visible.length
    ? `${visible.length} of ${calls.length} calls shown`
    : showAll.checked ? "No matching calls." : "No calls need triage.";
}

async function load() {
  try {
    const scenarios = await readJSON("data/scenarios.json");
    const loaded = await Promise.all(scenarios.map(loadCall));
    const calls = claimType
      ? loaded.filter(({ report }) =>
          report.verdicts.some(verdict => verdict.claim.type === claimType))
      : loaded;
    calls.sort((a, b) => a.rank - b.rank);
    if (claimType) {
      document.getElementById("active-claim-type").textContent = claimType;
      document.getElementById("claim-filter").hidden = false;
      showAll.checked = true;
    }
    render(calls);
    showAll.addEventListener("change", () => render(calls));
    showAll.disabled = false;
  } catch (error) {
    statusMessage.textContent = `Inbox unavailable. ${error.message}`;
  }
}

load();
</script>
</body>
</html>
