<!doctype html>
<!-- Generated by scripts/export_review_demo.py. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review queue demo | Subpoena</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #11181c; --card: #1a252b; --line: #384b53; --text: #eff3ee;
    --muted: #b1c1c5; --accent: #9cd8f1; --amber: #ffc095;
    --mono: ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 1rem/1.6 system-ui; }
  header { border-bottom: 1px solid var(--line); }
  .brand, main { max-width: 66rem; margin: auto; padding-inline: clamp(1rem, 4vw, 3rem); }
  .brand { padding-block: 1rem; font: 700 .9rem var(--mono); letter-spacing: .16em; }
  main { padding-block: clamp(2rem, 6vw, 5rem); }
  h1, h2, h3, p { margin: 0; }
  h1 { font-size: clamp(2.35rem, 7vw, 4.6rem); line-height: 1.05; letter-spacing: -.05em; }
  h2 { font: 700 clamp(1rem, 3vw, 1.4rem)/1.3 var(--mono); margin-bottom: .65rem; }
  h3 { font-size: 1rem; margin-top: .85rem; }
  a { color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .intro, .meta { color: var(--muted); }
  .intro { margin-block: 1rem; }
  .meta, .flag { font: 700 .8rem/1.6 var(--mono); }
  .flag { color: var(--amber); margin-top: .85rem; }
  #queue { display: grid; gap: .75rem; margin-top: 2rem; }
  article {
    padding: .9rem 1rem; background: var(--card); border: 1px solid var(--line);
    border-radius: .65rem; overflow-wrap: anywhere;
  }
  ol { margin: .35rem 0 0; padding-left: 1.5rem; }
  li + li { margin-top: .4rem; }
  @media (max-width: 600px), (max-width: 900px) and (max-height: 500px) and (hover: none) {
    main { padding-block: 1rem 2rem; overflow-wrap: anywhere; }
    h1 { margin-top: .5rem; }
    .meta, .flag { font-size: .9375rem; }
    a { display: inline-flex; align-items: center; min-height: 44px; max-width: 100%; }
  }
</style>
</head>
<body>
<header><div class="brand">SUBPOENA</div></header>
<main>
  <a href="./">Back to audit demo</a>
  <h1>Review queue demo</h1>
  <p class="intro">These are merges the auditor refused to make on its own.
    The queue comes from simulated clinic calls.</p>
  <a href="data-review/review.json">Download the run data</a>
  <p id="status" role="status">Loading the review queue…</p>
  <noscript>Enable JavaScript to view the review queue.</noscript>
  <div id="queue"></div>
</main>
<script>
  const queue = document.getElementById("queue");
  const statusMessage = document.getElementById("status");
  const utc = new Intl.DateTimeFormat("en", {
    dateStyle: "medium", timeStyle: "short", timeZone: "UTC",
  });

  function add(parent, tag, text, className) {
    const element = document.createElement(tag);
    if (text != null) element.textContent = text;
    if (className) element.className = className;
    parent.append(element);
    return element;
  }

  function render({reviews}) {
    for (const review of reviews) {
      const card = add(queue, "article");
      add(card, "h2", review.reason);
      add(card, "p", review.detail);
      add(card, "h3", "Call timeline");
      const timeline = add(card, "ol");
      for (const call of review.calls) {
        const item = add(timeline, "li");
        const time = add(item, "time", utc.format(new Date(call.started_at)) + " UTC");
        time.dateTime = call.started_at;
        add(item, "p", "Call outcome · " + call.outcome, "meta");
        add(item, "p", call.audit_id, "meta");
      }
      add(card, "p", "UNMERGED · Pending a human decision", "flag");
    }
    statusMessage.hidden = reviews.length > 0;
    statusMessage.textContent = "No review candidates.";
  }

  fetch("data-review/review.json")
    .then(response => {
      if (!response.ok) throw new Error("Could not load run data");
      return response.json();
    })
    .then(render)
    .catch(() => {
      statusMessage.textContent = "Could not load the review queue. "
        + "Serve this directory over HTTP with its data-review folder beside the page.";
    });
</script>
</body>
</html>
