<!doctype html>
<!-- Generated by scripts/export_failures_demo.py -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Failure gallery | Subpoena</title>
<style>
  :root {
    color-scheme: dark;
    font: 100%/1.55 system-ui, sans-serif;
    background: #111519;
    color: #f0f4f5;
    --panel: #1a2228;
    --line: #35434c;
    --muted: #b5c4cb;
    --mint: #9be7c4;
    --amber: #ffc095;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { max-width: 66rem; margin: auto; padding: clamp(1rem, 5vw, 4rem); }
  header { padding-bottom: 1.75rem; border-bottom: 1px solid var(--line); }
  h1 { font-size: clamp(2.4rem, 7vw, 4.6rem); line-height: 1.06; letter-spacing: -.05em; }
  h1 { margin: .65rem 0; }
  h2, h3 { margin: 0 0 .55rem; }
  p { margin: .45rem 0; }
  a { color: var(--mint); }
  :focus-visible { outline: 2px solid var(--mint); outline-offset: 4px; }
  .intro, .turn strong, .evidence { color: var(--muted); }
  .record { color: var(--amber); font-size: 1.25rem; font-weight: 700; }
  article {
    margin-top: 1.5rem; padding: clamp(1rem, 3vw, 1.75rem);
    border: 1px solid var(--line); border-radius: .75rem; background: var(--panel);
    overflow-wrap: anywhere;
  }
  h2, .verdict { font-family: ui-monospace, monospace; }
  h2 { font-size: 1.25rem; }
  h3 { font-size: 1rem; }
  .transcript { margin: 0 0 1.25rem; padding: 0; list-style: none; }
  .turn { padding: .45rem 0; border-bottom: 1px solid var(--line); }
  .turn strong { display: block; text-transform: capitalize; font-size: .85rem; }
  .comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
  .comparison section { padding: .85rem; background: #111519; border-radius: .4rem; }
  .verdict { color: var(--amber); }
  .evidence { padding-left: 1.25rem; }
  .why { margin-top: 1.25rem; }
  @media (max-width: 38rem) {
    .comparison { grid-template-columns: minmax(0, 1fr); }
    a { display: inline-flex; align-items: center; min-height: 44px; }
    h1 { font-size: clamp(2rem, 10vw, 2.4rem); }
    .turn strong { font-size: .9375rem; }
  }
</style>
</head>
<body>
<main>
  <header>
    <a href="./">Back to audit demo</a>
    <h1>Failure gallery</h1>
    <p class="intro">What the rule-based auditor missed in the golden evaluation,
      replayed from the original scenarios.</p>
    <p class="record" id="record" hidden></p>
    <a href="evals.html">View the full eval results</a>
  </header>
  <p id="status" role="status">Loading the golden failures…</p>
  <noscript>Enable JavaScript to view the replay transcripts and verdicts.</noscript>
  <div id="failures"></div>
</main>
<script>
  const byId = id => document.getElementById(id);

  function node(tag, text, className) {
    const element = document.createElement(tag);
    if (text !== undefined) element.textContent = text;
    if (className) element.className = className;
    return element;
  }

  function renderFailure(failure) {
    const card = node("article");
    card.append(node("h2", failure.scenario_id), node("h3", "Call transcript"));
    const transcript = node("ol", undefined, "transcript");
    for (const turn of failure.transcript) {
      const line = node("li", undefined, "turn");
      line.append(node("strong", turn.speaker), document.createTextNode(turn.text));
      transcript.append(line);
    }

    const comparison = node("div", undefined, "comparison");
    const expected = node("section");
    expected.append(node("h3", "Expected verdict"));
    for (const verdict of failure.expected_verdicts) {
      expected.append(node("p", `${verdict.claim} · ${verdict.status}`, "verdict"));
    }
    const actual = node("section");
    actual.append(node("h3", "Auditor report"), node("p", `Call outcome · ${failure.outcome}`));
    if (!failure.verdicts.length) {
      actual.append(node("p", "No claim verdicts. The auditor saw no claim."));
    }
    for (const verdict of failure.verdicts) {
      actual.append(node("p", `${verdict.claim} · ${verdict.status}`, "verdict"),
                    node("p", verdict.summary));
      if (verdict.evidence.length) {
        const evidence = node("ul", undefined, "evidence");
        for (const note of verdict.evidence) evidence.append(node("li", note));
        actual.append(evidence);
      }
    }
    comparison.append(expected, actual);

    const why = node("section", undefined, "why");
    why.append(node("h3", "Why this is hard"), node("p", failure.why_hard));
    card.append(transcript, comparison, why);
    return card;
  }

  fetch("data-failures/gallery.json")
    .then(response => {
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    })
    .then(data => {
      const accuracy = (data.call_strict_accuracy * 100).toFixed(2);
      byId("failures").replaceChildren(...data.failures.map(renderFailure));
      byId("record").textContent =
        `${data.strict_passes}/${data.calls} golden calls passed strict scoring (${accuracy}%)`;
      byId("record").hidden = false;
      byId("status").hidden = true;
    })
    .catch(() => {
      byId("status").textContent = "Could not load the golden failures. "
        + "Serve this directory over HTTP with its data-failures folder beside the page.";
    });
</script>
</body>
</html>
