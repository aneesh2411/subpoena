<!doctype html>
<!-- Generated by scripts/export_diff_demo.py -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit diff | Subpoena</title>
<style>
  :root {
    color-scheme: dark;
    font: 100%/1.55 system-ui, sans-serif;
    background: #111519;
    color: #f0f4f5;
    --panel: #1a2228;
    --line: #35434c;
    --muted: #b5c4cb;
    --mint: #9be7c4;
    --amber: #ffc095;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { max-width: 66rem; margin: auto; padding: clamp(1rem, 5vw, 4rem); }
  header { padding: 1.5rem 0 2.25rem; border-bottom: 1px solid var(--line); }
  h1, h2, h3, p { margin: 0; }
  h1 { font-size: clamp(2.4rem, 7vw, 4.6rem); line-height: 1.06; letter-spacing: -.05em; }
  header p, section > p { color: var(--muted); margin-top: .65rem; }
  section { margin-top: 2.25rem; }
  h2 { font-size: 1.35rem; margin-bottom: .8rem; }
  h3 { font-size: 1rem; }
  a { color: var(--mint); }
  :focus-visible { outline: 2px solid var(--mint); outline-offset: 4px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
  .card { border: 1px solid var(--line); border-radius: .75rem; background: var(--panel); }
  article { padding: 1.05rem; }
  article p { margin: .4rem 0; overflow-wrap: anywhere; }
  .outcome { font-size: 1.5rem; font-weight: 750; }
  .seal, .field-label { color: var(--muted); font-size: .9rem; }
  .list { padding: 0; margin: 0; list-style: none; display: grid; gap: .65rem; }
  .transition {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto 2rem auto;
    gap: .65rem;
    align-items: center;
    padding: .8rem 1rem;
  }
  .badge { border: 1px solid currentColor; border-radius: .35rem; padding: .2rem .4rem; }
  .badge, .outcome { font-family: ui-monospace, monospace; }
  [data-state="VERIFIED"], [data-state="CLEAN"] { color: var(--mint); }
  [data-state="MISMATCH"], [data-state="DISCREPANCIES"] { color: var(--amber); }
  svg { width: 100%; color: var(--muted); }
  #fields { display: grid; gap: .75rem; }
  .field-grid { margin-top: .75rem; }
  .field-grid > div { padding: .6rem .75rem; border-left: 2px solid var(--line); }
  dl { margin: .4rem 0 0; }
  dt { color: var(--muted); font-size: .85rem; }
  dd { margin: 0 0 .35rem; overflow-wrap: anywhere; }
  @media (max-width: 600px), (max-width: 900px) and (max-height: 500px) and (hover: none) {
    main { padding: 1rem; overflow-wrap: anywhere; }
    header { padding: 1rem 0; }
    section { margin-top: 1.5rem; }
    .grid { grid-template-columns: minmax(0, 1fr); }
    .transition {
      grid-template-columns: minmax(0, auto) 1.5rem minmax(0, auto);
      justify-content: start;
    }
    .transition h3 { grid-column: 1 / -1; }
    .seal, .field-label, dt { font-size: .9375rem; }
    a { display: inline-flex; align-items: center; min-height: 44px; max-width: 100%; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Audit diff</h1>
    <p>Replay the same booking call after correcting the calendar write.
       Compare the sealed audits to see which promises the receipts support.</p>
  </header>
  <p id="status" role="status">Loading the audit comparison…</p>
  <div id="comparison" hidden>
    <section aria-labelledby="outcomes-title">
      <h2 id="outcomes-title">Audit outcomes</h2>
      <div class="grid" id="outcomes"></div>
    </section>
    <section aria-labelledby="verdicts-title">
      <h2 id="verdicts-title">Claim verdicts</h2>
      <p>Before the fix and after the replay, in that order.</p>
      <ul class="list" id="verdicts"></ul>
    </section>
    <section aria-labelledby="fields-title">
      <h2 id="fields-title">Field-level changes</h2>
      <div id="fields"></div>
    </section>
  </div>
</main>
<template id="arrow">
  <svg viewBox="0 0 32 16" aria-hidden="true" focusable="false">
    <path d="M2 8h26m-6-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2"/>
  </svg>
</template>
<script>
  const byId = id => document.getElementById(id);
  function node(tag, text, className) {
    const element = document.createElement(tag);
    if (text !== undefined) element.textContent = text;
    if (className) element.className = className;
    return element;
  }

  const labels = { before: "Before the fix", after: "After the fix" };
  const claimNames = {
    AppointmentBooked: "Appointment booking",
    ConfirmationSent: "Confirmation message"
  };

  function renderOutcome(side, run) {
    const card = node("article", undefined, "card");
    const outcome = node("p", run.outcome, "outcome");
    outcome.dataset.state = run.outcome;
    const report = node("a", "Download sealed audit JSON");
    report.href = `data-diff/${side}.json`;
    card.append(node("h3", labels[side]), outcome, node("p", run.seal, "seal"), report);
    byId("outcomes").append(card);
  }

  function renderFields(claim, title) {
    for (const change of claim.fields) {
      const card = node("article", undefined, "card");
      card.append(node("h3", title));
      card.append(node("p", `${change.kind} field · ${change.field}`, "field-label"));
      const grid = node("div", undefined, "grid field-grid");
      for (const side of Object.keys(labels)) {
        const column = node("div");
        column.append(node("strong", labels[side]));
        const value = change[side];
        if (value === null) {
          column.append(node("p", "No row for this field"));
        } else if (change.kind === "receipt") {
          for (const receipt of value) {
            const info = node("dl");
            info.append(node("dt", "Claimed"), node("dd", receipt.claimed),
                        node("dt", "Recorded"), node("dd", receipt.actual),
                        node("dt", "Comparison"), node("dd", receipt.match ? "Match" : "Mismatch"));
            column.append(info);
          }
        } else {
          column.append(node("p", JSON.stringify(value)));
        }
        grid.append(column);
      }
      card.append(grid);
      byId("fields").append(card);
    }
  }

  function renderClaim(claim) {
    const title = claimNames[claim.claim_type] ?? claim.claim_type;
    const row = node("li", undefined, "card transition");
    row.append(node("h3", title));
    for (const side of Object.keys(labels)) {
      const badge = node("span", claim[side], "badge");
      badge.dataset.state = claim[side];
      badge.setAttribute("aria-label", `${labels[side]}, ${claim[side]}`);
      row.append(badge);
      if (side === "before") row.append(byId("arrow").content.cloneNode(true));
    }
    byId("verdicts").append(row);
    renderFields(claim, title);
  }

  fetch("data-diff/diff.json")
    .then(response => {
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    })
    .then(data => {
      for (const side of Object.keys(labels)) renderOutcome(side, data.runs[side]);
      for (const claim of data.claims) renderClaim(claim);
      byId("status").hidden = true;
      byId("comparison").hidden = false;
    })
    .catch(() => {
      byId("status").textContent = "Could not load the audit comparison. "
        + "Serve this directory over HTTP with its data-diff folder beside the page.";
    });
</script>
</body>
</html>
