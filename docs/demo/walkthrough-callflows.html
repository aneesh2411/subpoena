<!doctype html>
<!-- Generated by scripts/export_callflows_demo.py. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call-flow walkthrough | Subpoena</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #11181c; --card: #1a252b; --line: #384b53; --text: #eff3ee;
    --muted: #b1c1c5; --accent: #9cd8f1; --verified: #8bd9b4;
    --mismatch: #ffbf87; --not-found: #ffa8ad; --unverifiable: #d6beff;
    --mono: ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 1rem/1.6 system-ui; }
  header { border-bottom: 1px solid var(--line); }
  .brand, main { max-width: 76rem; margin: auto; padding-inline: clamp(1rem, 4vw, 3rem); }
  .brand { padding-block: 1rem; font: 700 .9rem var(--mono); letter-spacing: .16em; }
  main { padding-block: clamp(2rem, 6vw, 5rem); }
  h1, h2, h3, p, blockquote { margin: 0; }
  h1 { font-size: clamp(2.35rem, 7vw, 4.6rem); line-height: 1.05; letter-spacing: -.05em; }
  h2 { font-size: clamp(1.4rem, 3vw, 2rem); line-height: 1.2; }
  .intro { max-width: 44rem; margin-block: 1rem; color: var(--muted); }
  a { color: var(--accent); }
  a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  section { margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid var(--line); }
  .flow { display: grid; grid-template-columns: .9fr 1.15fr 1fr; gap: 1.25rem; margin-top: 1rem; }
  .step {
    position: relative; min-width: 0; padding: 1rem; background: var(--card);
    border: 1px solid var(--line); border-radius: .65rem; overflow-wrap: anywhere;
  }
  .step + .step::before {
    content: ""; position: absolute; top: 1.35rem; right: 100%; width: 1.25rem;
    border-top: 2px solid var(--line);
  }
  h3 { font: 700 .77rem/1.5 var(--mono); color: var(--accent); text-transform: uppercase;
    letter-spacing: .08em; margin-bottom: .85rem; }
  blockquote { font-size: 1.08rem; border-left: 2px solid var(--accent); padding-left: .8rem; }
  blockquote + blockquote, details, .record + .record, .result + .result { margin-top: .8rem; }
  .record { border-left: 2px solid var(--line); padding-left: .7rem; }
  .record p, summary { color: var(--muted); font-size: .86rem; }
  summary { cursor: pointer; }
  ul, dl { padding: 0; margin: .5rem 0 0; }
  ul { list-style: none; }
  .feeds li + li { margin-top: .35rem; }
  .feeds, dl { font-size: .8rem; color: var(--muted); }
  dt { color: var(--text); }
  dd { margin: 0 0 .4rem; font-family: var(--mono); }
  .strip { display: flex; gap: .25rem; margin-top: .5rem; }
  .strip span { height: .5rem; border-radius: .3rem; background: currentColor; }
  .legend { display: flex; flex-wrap: wrap; gap: .35rem .8rem; }
  .legend, .status, .outcome { font: 700 .75rem/1.6 var(--mono); }
  .outcome { color: var(--muted); }
  .VERIFIED { color: var(--verified); }
  .MISMATCH { color: var(--mismatch); }
  .NOT_FOUND { color: var(--not-found); }
  .UNVERIFIABLE { color: var(--unverifiable); }
  .result { border-top: 1px solid var(--line); padding-top: .6rem; margin-top: .75rem; }
  .result p { font-size: .9rem; }
  @media (max-width: 52rem) {
    .flow { grid-template-columns: 1fr; }
    .step + .step::before {
      top: auto; bottom: 100%; left: 1rem; width: 0; height: 1.25rem;
      border-top: 0; border-left: 2px solid var(--line);
    }
  }
  @media (max-width: 600px), (max-width: 900px) and (max-height: 500px) and (hover: none) {
    main { padding-block: 1rem 2rem; overflow-wrap: anywhere; }
    section { margin-top: 1.5rem; padding-top: 1rem; }
    h3, .record p, .feeds, dl, .legend, .status, .outcome, .result p {
      font-size: .9375rem;
    }
    a { display: inline-flex; align-items: center; min-height: 44px; max-width: 100%; }
    summary { min-height: 44px; padding-block: 9px; font-size: 1rem; }
  }
</style>
</head>
<body>
<header><div class="brand">SUBPOENA</div></header>
<main>
  <h1>Call-flow walkthrough</h1>
  <p class="intro">
    Follow a voice agent’s promise from the call transcript to the system records
    and the auditor’s verdict. These examples are from the simulated golden dataset.
  </p>
  <a href="data-callflows/scenarios.json">Download the run data</a>
  <p id="loading" role="status">Loading audited scenarios…</p>
  <noscript>Enable JavaScript to view the walkthrough.</noscript>
  <div id="scenarios"></div>
</main>
<script>
  const verdictKeys = {
    VERIFIED: "verified",
    MISMATCH: "mismatch",
    NOT_FOUND: "not_found",
    UNVERIFIABLE: "unverifiable",
  };
  const claimLabels = {
    AppointmentBooked: "Booking",
    ConfirmationSent: "Confirmation",
    Rescheduled: "Reschedule",
    HandoffCreated: "Handoff",
    PaymentCollected: "Payment",
    RecordsUpdated: "Record update",
    PrescriptionRefilled: "Prescription refill",
  };

  function add(parent, tag, text, className) {
    const element = document.createElement(tag);
    if (text != null) element.textContent = text;
    if (className) element.className = className;
    parent.append(element);
    return element;
  }

  function step(flow, title) {
    const panel = add(flow, "div", null, "step");
    add(panel, "h3", title);
    return panel;
  }

  function renderEvidence(panel, scenario) {
    for (const verdict of scenario.verdicts) {
      for (const evidence of verdict.evidence) {
        const item = add(panel, "div", null, "record");
        add(item, "strong", evidence.source);
        add(item, "p", evidence.note);
        const details = add(item, "details");
        add(details, "summary", "Source reference and fields");
        add(details, "p", evidence.ref);
        if (evidence.record) {
          const fields = add(details, "dl");
          for (const [name, value] of Object.entries(evidence.record)) {
            add(fields, "dt", name.replaceAll("_", " "));
            add(fields, "dd", value);
          }
        }
      }
    }
    const feeds = add(panel, "details");
    add(feeds, "summary", "Change feeds read by the auditor");
    const list = add(feeds, "ul", null, "feeds");
    for (const event of scenario.evidence_trail) add(list, "li", event.message);
  }

  function renderVerdicts(panel, scenario) {
    add(panel, "p", "Call outcome · " + scenario.outcome, "outcome");
    const strip = add(panel, "div", null, "strip");
    strip.setAttribute("aria-hidden", "true");
    const legend = add(panel, "ul", null, "legend");
    for (const [status, key] of Object.entries(verdictKeys)) {
      const count = scenario.stats[key];
      if (count === 0) continue;
      const segment = add(strip, "span", null, status);
      segment.style.flexGrow = count;
      add(legend, "li", count + " " + status, status);
    }
    for (const verdict of scenario.verdicts) {
      const result = add(panel, "div", null, "result");
      const label = claimLabels[verdict.claim.type] ?? verdict.claim.type;
      add(result, "strong", label + " · " + verdict.status, "status " + verdict.status);
      add(result, "p", verdict.summary);
      const topic = verdict.diffs.find(diff => diff.field === "topic");
      if (topic) {
        const comparison = add(result, "dl");
        add(comparison, "dt", "Stated topic");
        add(comparison, "dd", topic.claimed);
        add(comparison, "dt", "Ticket topic");
        add(comparison, "dd", topic.actual);
      }
    }
  }

  function renderScenario(parent, scenario) {
    const section = add(parent, "section");
    section.id = scenario.id;
    const title = add(section, "h2", scenario.title);
    title.id = scenario.id + "-title";
    section.setAttribute("aria-labelledby", title.id);
    const flow = add(section, "div", null, "flow");
    const call = step(flow, "Claim on the call");
    const utterances = new Set(scenario.verdicts.map(verdict => verdict.claim.utterance));
    for (const utterance of utterances) add(call, "blockquote", utterance);
    renderEvidence(step(flow, "Evidence snapshot"), scenario);
    renderVerdicts(step(flow, "Verdict"), scenario);
  }

  const loading = document.getElementById("loading");
  fetch("data-callflows/scenarios.json")
    .then(response => {
      if (!response.ok) throw new Error("Could not load run data");
      return response.json();
    })
    .then(scenarios => {
      const content = document.createDocumentFragment();
      for (const scenario of scenarios) renderScenario(content, scenario);
      document.getElementById("scenarios").append(content);
      loading.remove();
      document.getElementById(location.hash.slice(1))?.scrollIntoView();
    })
    .catch(() => { loading.textContent = "Could not load the audited scenarios."; });
</script>
</body>
</html>
